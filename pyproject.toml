[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pipelinemd"
version = "0.1.0"
description = "GitLab CI/CD failure doctor - diagnoses failed pipelines and suggests fixes."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "rbalukja15" }]
keywords = ["gitlab", "ci", "cd", "pipeline", "logs", "diagnostics", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Logging",
]

# The core - fetching, distilling and rule-matching - has no third-party
# dependencies at all. It is meant to `pip install` into any runner image
# without dragging a tree behind it.
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/rbalukja15/pipelinemd"
Source = "https://github.com/rbalukja15/pipelinemd"
Issues = "https://github.com/rbalukja15/pipelinemd/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pipelinemd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# E501: long lines are unavoidable in the rule catalog's explanation strings.
# RUF001-003: this project matches and prints real tool output, which contains
# glyphs ruff considers ambiguous - Jest's "●" and "›", ESLint's "✖", and the
# guillemets in our own redaction mask. Flagging them is a false positive here.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/pipelinemd"]
