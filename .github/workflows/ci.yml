name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Nothing in CI writes to the repository, so its token cannot either.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Every step below goes through the Makefile, which invokes each tool as
      # `python -m <tool>`. A bare `pytest` or `mypy` on PATH can belong to a
      # different environment than the package is installed into, and CI is the
      # worst place to debug that. It also keeps `make check` honest: these are
      # literally the targets it runs.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          make install PYTHON=python

      - name: Lint and format check
        run: make lint PYTHON=python

      - name: Typecheck
        run: make typecheck PYTHON=python

      - name: Test
        run: make test PYTHON=python PYTEST_ARGS="--cov=pipelinemd --cov-report=term-missing"

      # The regression gate. Offline and deterministic, so it costs a few
      # seconds and nothing else. Without this step --min-rule-accuracy is a
      # flag nobody runs, and the eval is a report rather than a guard.
      - name: Eval gate
        run: make gate PYTHON=python

  # The image is what the README tells GitLab users to run, so it is built and
  # exercised on every push, not first on a release tag. amd64 only: that is
  # what the runner can execute natively, and the arm64 half is the same
  # Dockerfile built under emulation by the release workflow. Kept out of the
  # matrix above, which tests the package across Pythons and needs no Docker.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same targets as `make image image-smoke` locally, for the same reason
      # as the steps above.
      - name: Build
        run: make image

      - name: Smoke test
        run: make image-smoke
