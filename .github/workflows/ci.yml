name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Every step below goes through the Makefile, which invokes each tool as
      # `python -m <tool>`. A bare `pytest` or `mypy` on PATH can belong to a
      # different environment than the package is installed into, and CI is the
      # worst place to debug that. It also keeps `make check` honest: these are
      # literally the targets it runs.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          make install PYTHON=python

      - name: Lint and format check
        run: make lint PYTHON=python

      - name: Typecheck
        run: make typecheck PYTHON=python

      - name: Test
        run: make test PYTHON=python PYTEST_ARGS="--cov=pipelinemd --cov-report=term-missing"

      # The regression gate. Offline and deterministic, so it costs a few
      # seconds and nothing else. Without this step --min-rule-accuracy is a
      # flag nobody runs, and the eval is a report rather than a guard.
      - name: Eval gate
        run: make gate PYTHON=python
