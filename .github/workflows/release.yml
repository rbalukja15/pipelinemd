name: Release

# A version tag is the only way in. Branch pushes and pull requests are CI's
# business; nothing here should run without a person deciding to release.
on:
  push:
    tags: ["v*.*.*"]

# Every job asks for exactly what it needs below, so nothing inherits a write
# token by default.
permissions: {}

# Two tags pushed close together must not interleave their uploads, and a
# release half-way through PyPI must not be cancelled by the next one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The checks CI's test job runs, again, on the exact commit being tagged,
  # plus the one check CI cannot make: that the tag, __version__ and
  # CHANGELOG.md agree, and that the version is a final release. The image
  # smoke test is not repeated: CI's image job ran it when the commit was
  # pushed. PyPI never accepts the same version twice, so this has to be
  # settled before anything is uploaded.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tag reaches the script through the environment, never by being
      # pasted into the script: a tag name is text whoever pushed it chose.
      - name: Tag matches the version and the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: make release-notes PYTHON=python

      - name: Install
        run: |
          python -m pip install --upgrade pip
          make install PYTHON=python

      - name: Lint, typecheck, test and eval gate
        run: make check PYTHON=python

  # Built once, here, and uploaded as-is: the files on PyPI and on the GitHub
  # Release are byte-for-byte the ones twine checked.
  dist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          make dist PYTHON=python

      # The version is read from __init__.py by hatch; this proves the files
      # carry the tag's version rather than trusting that they do.
      - name: Built version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test -f "dist/pipelinemd-${TAG#v}-py3-none-any.whl"
          test -f "dist/pipelinemd-${TAG#v}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Trusted publishing: PyPI exchanges this job's OIDC token for a short-lived
  # upload credential, so there is no API token to store, leak or rotate. The
  # pypi environment is what the trusted publisher is bound to, and where a
  # required reviewer can be added to gate every release by hand.
  pypi:
    needs: [verify, dist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pipelinemd/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  # After PyPI, not beside it. An image tag can be pushed again; a PyPI version
  # cannot. Waiting means a failed upload leaves nothing published under that
  # version, rather than an image for a package that does not exist.
  image:
    needs: [verify, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # arm64 is built under emulation. Slow, but the image is all wheels, so
      # nothing is compiled and emulation costs minutes rather than an hour.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.4.2 becomes 1.4.2, 1.4 and latest. The example GitLab job pins the
      # minor tag, so it picks up patch releases and never a breaking one.
      # Verify has already refused anything that is not a final X.Y.Z release.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rbalukja15/pipelinemd
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      # No build cache: each version is built exactly once, so a cache would
      # only ever be written, never read.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Last, so a release page never announces something that failed to publish.
  github-release:
    needs: [pypi, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # The notes are the changelog section verify already checked, so the
      # release page and CHANGELOG.md say the same thing.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          make release-notes > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
