# Drop-in job: diagnose the pipeline when something in it fails.
#
# Include it from your .gitlab-ci.yml:
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/rbalukja15/pipelinemd/main/examples/gitlab-ci-diagnose.yml'
#
# Set ANTHROPIC_API_KEY as a masked CI/CD variable to enable the diagnosis
# layer. Without it the job still runs and reports the rule findings.

pipelinemd:
  stage: .post
  # The published image already has pipelinemd and the [llm] extra installed,
  # so there is no pip install to slow the job down or fail when PyPI is
  # unreachable. Pinned to a minor version: it picks up patch releases, and a
  # release that changes the report format cannot break this job unannounced -
  # which `latest` would allow.
  image:
    name: ghcr.io/rbalukja15/pipelinemd:0.1
    # The image's entrypoint is the pipelinemd CLI. GitLab runs the script
    # below through a shell, so the entrypoint is cleared to let it.
    entrypoint: [""]
  # .post runs after everything else, so by now the pipeline's fate is known.
  rules:
    - when: on_failure
  # Never let the diagnostic job itself turn a pipeline red.
  allow_failure: true
  interruptible: true
  variables:
    GIT_STRATEGY: none
  script:
    # CI_JOB_TOKEN and CI_PIPELINE_ID are picked up automatically.
    - pipelinemd diagnose --format markdown -o pipelinemd-diagnosis.md
    - pipelinemd diagnose --format json -o pipelinemd-diagnosis.json
    - cat pipelinemd-diagnosis.md
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - pipelinemd-diagnosis.md
      - pipelinemd-diagnosis.json
